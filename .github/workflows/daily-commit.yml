name: Daily Commit with 24f2008074@ds.study.iitm.ac.in

on:
  schedule:
    # Runs at 01:00 UTC every day (cron: minute hour day month day-of-week)
    - cron: '0 1 * * *' 
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Daily update by 24f2008074@ds.study.iitm.ac.in
        run: |
          echo "Daily update $(date -u)" >> daily-log.txt

      - name: Configure Git
        run: |
          git config --local user.email "24f2008074@ds.study.iitm.ac.in"
          git config --local user.name "github-actions[bot]"

      - name: Commit changes
        run: |
          git add daily-log.txt
          git commit -m "Automated daily update [skip ci]" || exit 0
          git push
